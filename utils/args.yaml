  input_size: 640
  batch_size: 32
  epochs: 160
  flat_epoch: 78
  no_aug_epoch: 12
  warmup_iter: 2000
  lr: 0.0008
  lr_backbone: 0.0004
  lr_gamma: 1.0
  aug_epochs: [4, 78, 148]
  mosaic: 0.5
  mix_up: 0.5
  mix_up_epochs: [4, 78]
  copy_blend: 0.4
  copy_blend_epochs: [4, 78]
  min_size: 1
  matcher_change_epoch: 136
  local: True
  uni_set: True
s: &dinov3
  backbone: ./weights/pt/vitt_distill.pt
  input_size: 640
  batch_size: 32
  epochs: 132
  flat_epoch: 64
  no_aug_epoch: 12
  warmup_iter: 2000
  lr: 0.0005
  lr_backbone: 0.000025
  lr_gamma: 0.5
  weight_decay: 0.0001
  aug_epochs: [4, 64, 120]
  mosaic: 0.5
  mix_up: 0.5
  mix_up_epochs: [4, 64]
  copy_blend: 0.5
  copy_blend_epochs: [4, 120]
  multi_scale: 20
  min_size: 1
  matcher_change_epoch: 100
  local: True
  uni_set: True
m:
