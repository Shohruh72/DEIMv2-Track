mal: 1.000000000000000            # matchability-aware classification loss gain
l1: 5.0000000000000000            # L1 box loss gain
giou: 2.000000000000000           # GIoU box loss gain
fgl: 0.150000000000000            # fine-grained localization loss gain
ddf: 1.500000000000000            # decoupled distillation focal loss gain
max_det: 300                      # detections per image (top-k over query x class, no NMS)
area_threshold: 100               # copy-blend: min object area (pixels)
num_objects: 3                    # copy-blend: objects pasted per image
expand_ratios: [0.10, 0.25]       # copy-blend: context around pasted objects

track_high: 0.4                   # tracking: detections above extend and start tracks (tuned on MOT17)
track_low: 0.05                   # tracking: detections in (low, high) only extend tracks (occlusion, blur)
track_new: 0.4                    # tracking: min score to start a track
track_match: 0.8                  # tracking: max cost (1 - IoU x score) of the first association
track_buffer: 30                  # tracking: frames (at 30 FPS) a lost track waits to be re-found
track_cmc: 0                      # tracking: camera motion compensation, 1 for moving cameras

# Official DEIMv2 COCO recipes. `batch_size` is the total batch size, reached by gradient accumulation.
# aug_epochs: [start, mosaic stop, stop] of mosaic / zoom-out / IoU-crop / photometric augmentation.
# The last `no_aug_epoch` epochs restart from the best checkpoint without augmentation.
atto: &hgnet
  backbone: ~                     # PP-HGNetV2-B0 ImageNet weights are downloaded automatically
  input_size: 320
  batch_size: 128
  epochs: 500
  flat_epoch: 250                 # constant lr until this epoch, then cosine decay
  no_aug_epoch: 32
  warmup_iter: 4000
  lr: 0.002
  lr_backbone: 0.001
  lr_gamma: 0.5                   # final lr = lr * lr_gamma
  weight_decay: 0.0001
  aug_epochs: [4, 250, 400]
  mosaic: 0.3
  mix_up: 0.0
  mix_up_epochs: [0, 0]
  copy_blend: 0.0
  copy_blend_epochs: [0, 0]
  multi_scale: 0                  # > 0: multi-scale training, the base size is repeated n times
  min_size: 12                    # min box size after augmentation (pixels)
  matcher_change_epoch: 450       # matching cost becomes -score * IoU^4
  local: False                    # FGL + DDF losses
  uni_set: False                  # box losses on the union of matches of all decoder layers
femto:
  <<: *hgnet
  input_size: 416
  lr: 0.0016
  lr_backbone: 0.0008
  mosaic: 0.5
  min_size: 10
pico:
  <<: *hgnet
  input_size: 640
  lr: 0.0016
  lr_backbone: 0.0008
  mosaic: 0.5
  min_size: 8
n:
